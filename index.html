<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0b0b">
<title>Aschenthron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;0,700;1,500&family=Vollkorn:wght@600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="stage">
  <div id="mat" aria-hidden="true"><img src="cards/pk-14-1.jpg" alt=""></div>

  <header id="hud"></header>
  <main id="mid">
    <section id="opps" aria-label="Gegner"></section>
    <section id="table" aria-label="Tisch">
      <div id="deck" aria-hidden="true"></div>
      <div id="pot"></div>
      <div id="board"></div>
      <div id="read" aria-live="polite"></div>
    </section>
  </main>
  <section id="ctrl" aria-label="Aktionen"></section>
  <section id="hand" aria-label="Deine Karten"></section>
</div>

<div id="ov" hidden></div>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
