<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a120c">
<title>Krug &amp; Krone</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="stage" class="canvas">
  <img class="corner tl" src="orn/corner.svg" alt=""><img class="corner tr" src="orn/corner.svg" alt=""><img class="corner bl" src="orn/corner.svg" alt=""><img class="corner br" src="orn/corner.svg" alt=""><div class="candle"></div>
  <header id="hud"></header>
  <section id="opps" aria-label="Gegner"></section>
  <section id="table" aria-label="Tisch">
    <div id="deck" aria-hidden="true"></div>
    <div id="pot"></div>
    <div id="board"></div>
  </section>
  <section id="mebar" aria-label="Du"><div id="meh"></div><div id="read" aria-live="polite"></div></section>
  <section id="ctrl" aria-label="Aktionen"></section>
  <section id="hand" aria-label="Deine Karten"></section>
</div>

<div id="ov" hidden></div>
<div id="rot" aria-live="polite"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="15" y="6" width="18" height="32" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M8 30a16 16 0 0 0 10 12" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M14 44l4-2-2-4" fill="none" stroke="currentColor" stroke-width="2.5"/></svg><b>Dreh dein Handy</b><span>Krug &amp; Krone spielt man hochkant.</span></div>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
