<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060405">
<title>Aschenthron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700;800&family=Alegreya+Sans+SC:wght@700;800&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="stage">
  <div id="scene" aria-hidden="true">
    <svg class="arch" viewBox="0 0 400 520" preserveAspectRatio="xMidYMin slice">
      <defs>
        <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a45a" stop-opacity=".5"/><stop offset="1" stop-color="#c9a45a" stop-opacity="0"/></linearGradient>
        <radialGradient id="halo" cx="50%" cy="36%" r="50%"><stop offset="0" stop-color="#e0873a" stop-opacity=".30"/><stop offset=".55" stop-color="#7a2c22" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="400" height="520" fill="url(#halo)"/>
      <!-- Thron: Rückenlehne mit Zacken -->
      <path d="M200 8 L214 52 L240 40 L238 96 L270 80 L262 150 L290 150 L290 330 L110 330 L110 150 L138 150 L130 80 L162 96 L160 40 L186 52 Z" fill="#0a0707" stroke="url(#gl)" stroke-width="1.4"/>
      <path d="M200 40 C168 70 160 120 162 200 L162 330 M200 40 C232 70 240 120 238 200 L238 330" fill="none" stroke="#c9a45a" stroke-opacity=".22" stroke-width="1"/>
      <path d="M0 330 L400 330 L400 520 L0 520Z" fill="#050303"/>
      <path d="M0 330 H400" stroke="#c9a45a" stroke-opacity=".25"/>
      <!-- Säulen -->
      <g fill="#0b0808" stroke="#c9a45a" stroke-opacity=".18">
        <rect x="-6" y="0" width="52" height="520"/><rect x="354" y="0" width="52" height="520"/>
      </g>
      <g stroke="#c9a45a" stroke-opacity=".12"><path d="M12 0V520M26 0V520M374 0V520M388 0V520"/></g>
    </svg>
    <svg class="rune" viewBox="0 0 200 200">
      <g fill="none" stroke="#c9a45a" stroke-opacity=".38">
        <circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="78" stroke-dasharray="2 6"/><circle cx="100" cy="100" r="60"/>
        <path d="M100 4 L118 82 L196 100 L118 118 L100 196 L82 118 L4 100 L82 82Z"/>
      </g>
      <g fill="#c9a45a" fill-opacity=".5" font-size="11" text-anchor="middle" font-family="serif">
        <text x="100" y="22">ᚠ</text><text x="178" y="104">ᚦ</text><text x="100" y="186">ᚱ</text><text x="22" y="104">ᚲ</text>
        <text x="153" y="47">ᚨ</text><text x="153" y="161">ᚷ</text><text x="47" y="161">ᚹ</text><text x="47" y="47">ᚺ</text>
      </g>
    </svg>
    <div class="fog f1"></div><div class="fog f2"></div>
  </div>

  <header id="hud"></header>
  <main id="mid">
    <section id="opps" aria-label="Gegner"></section>
    <section id="table" aria-label="Tisch">
      <div id="pot"></div>
      <div id="board"></div>
      <div id="read" aria-live="polite"></div>
      <div id="say" aria-live="polite"></div>
    </section>
  </main>
  <section id="ctrl" aria-label="Aktionen"></section>
  <section id="hand" aria-label="Deine Karten"></section>
  <div class="vig" aria-hidden="true"></div>
</div>

<div id="ov" hidden></div>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
